plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17'
}

// 自动版本号递增
def computeVersionName() {
    if (project.hasProperty('buildVersion')) {
        return project.property('buildVersion')
    }
    def versionFile = file('version.properties')
    def versionProps = new Properties()
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def major = versionProps.getProperty('VERSION_MAJOR', '1').toInteger()
    def minor = versionProps.getProperty('VERSION_MINOR', '1').toInteger()
    def patch = versionProps.getProperty('VERSION_PATCH', '0').toInteger() + 1
    versionProps.setProperty('VERSION_MAJOR', major.toString())
    versionProps.setProperty('VERSION_MINOR', minor.toString())
    versionProps.setProperty('VERSION_PATCH', patch.toString())
    versionFile.parentFile.mkdirs()
    versionFile.withOutputStream { versionProps.store(it, 'Auto-incremented by build') }
    return "${major}.${minor}.${patch}"
}

def computeVersionCode() {
    if (project.hasProperty('buildVersionCode')) {
        return project.property('buildVersionCode').toInteger()
    }
    return (System.currentTimeMillis() / 1000).toInteger()
}

android {
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "math-app-${variant.versionName}.apk"
        }
    }
    namespace 'com.mathkatex.verify'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'Reading@2026'
            keyAlias 'reading'
            keyPassword 'Reading@2026'
        }
    }

    defaultConfig {
        applicationId "com.mathkatex.verify"
        minSdk 26
        targetSdk 34
        versionCode computeVersionCode()
        versionName computeVersionName()

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    // WebView for KaTeX
    implementation 'androidx.webkit:webkit:1.8.0'
    
    // Network & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Markdown parsing
    implementation 'org.commonmark:commonmark:0.21.0'
    
    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // Lifecycle ViewModel Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

