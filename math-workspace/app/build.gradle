plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17'
}

// ---------------------------------------------------------------------------
// 版本号：构建只读 version.properties，绝不改写。
// 发新版本时显式执行 ./gradlew bumpVersion（或 -PbuildVersion/-PbuildVersionCode）。
// ---------------------------------------------------------------------------
def versionFile = file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def versionMajor = versionProps.getProperty('VERSION_MAJOR', '1').toInteger()
def versionMinor = versionProps.getProperty('VERSION_MINOR', '1').toInteger()
def versionPatch = versionProps.getProperty('VERSION_PATCH', '0').toInteger()
def versionNameValue = project.hasProperty('buildVersion')
        ? project.property('buildVersion').toString()
        : "${versionMajor}.${versionMinor}.${versionPatch}"
def versionCodeValue = project.hasProperty('buildVersionCode')
        ? project.property('buildVersionCode').toString().toInteger()
        : versionProps.getProperty('VERSION_CODE', '1').toInteger()

// ---------------------------------------------------------------------------
// 签名：口令只从 local.properties / 环境变量读取，不再写死在仓库里。
// local.properties 需要：
//   RELEASE_STORE_FILE=app/keystore.jks
//   RELEASE_STORE_PASSWORD=...
//   RELEASE_KEY_ALIAS=...
//   RELEASE_KEY_PASSWORD=...
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secret = { key, envName -> localProps.getProperty(key) ?: System.getenv(envName) }
def ksStorePath = secret('RELEASE_STORE_FILE', 'RELEASE_STORE_FILE')
def ksStorePassword = secret('RELEASE_STORE_PASSWORD', 'RELEASE_STORE_PASSWORD')
def ksKeyAlias = secret('RELEASE_KEY_ALIAS', 'RELEASE_KEY_ALIAS')
def ksKeyPassword = secret('RELEASE_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD')
def hasSigning = ksStorePath && ksStorePassword && ksKeyAlias && ksKeyPassword

android {
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "math-app-${variant.versionName}.apk"
        }
    }
    namespace 'com.mathkatex.verify'
    compileSdk 34

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(ksStorePath)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.mathkatex.verify"
        minSdk 26
        targetSdk 34
        versionCode versionCodeValue
        versionName versionNameValue

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 本机配置了 release 签名才沿用，否则用系统 debug key；
            // 不再把 release 口令带进日常构建。
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// 只在你明确执行 ./gradlew bumpVersion 时改版本文件
tasks.register('bumpVersion') {
    doLast {
        def p = new Properties()
        if (versionFile.exists()) versionFile.withInputStream { p.load(it) }
        def patch = p.getProperty('VERSION_PATCH', '0').toInteger() + 1
        def code = p.getProperty('VERSION_CODE', '1').toInteger() + 1
        p.setProperty('VERSION_PATCH', patch.toString())
        p.setProperty('VERSION_CODE', code.toString())
        versionFile.withOutputStream { p.store(it, 'Bumped by ./gradlew bumpVersion') }
        println "version -> ${p.getProperty('VERSION_MAJOR')}.${p.getProperty('VERSION_MINOR')}.${patch} (${code})"
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    // WebView for KaTeX
    implementation 'androidx.webkit:webkit:1.8.0'
    
    // Network & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Markdown parsing
    implementation 'org.commonmark:commonmark:0.21.0'
    
    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // Lifecycle ViewModel Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

